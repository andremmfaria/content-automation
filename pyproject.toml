[project]
name = "content-automation"
version = "0.1.0"
description = "Weekly DEV.to + LinkedIn publishing pipeline"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
content-automation = "content_automation.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_automation"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
