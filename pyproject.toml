[project]
name = "content-automation"
version = "0.1.0"
description = "Generate Buffer draft campaigns for DEV.to articles"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "requests>=2.32",
]

[project.scripts]
content-automation = "content_automation.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_automation"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
    "pytest>=8.0",
]
